<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animora — AI for Artists</title>

  <link rel="stylesheet" href="style.css">
<script defer src="script.js"></script>
  
</head>

<body>

<header class="site-header">
  <img src="animora-logo.png" alt="Animora" class="logo-image">
  <p class="tagline">AI-powered assistant for artists</p>
</header>

<main class="container">

<section class="hero">
  <h1>Transform Your Art into Opportunity</h1>
  <p>Create, grow, and earn with AI support.</p>
</section>

<section class="draw">
  <h2>Draw or Upload Artwork</h2>

  <canvas id="drawCanvas"></canvas>

  <div class="tools">
    <button id="penBtn">Pen</button>
    <button id="eraserBtn">Eraser</button>
    <input type="color" id="colorPicker">
    <button id="undoBtn">Undo</button>
    <button id="redoBtn">Redo</button>
    <button id="clear">Clear</button>
  </div>

  <button id="uploadButton" class="upload-button">Upload Artwork</button>
  <input type="file" id="fileInput" accept="image/*" hidden>

  <div id="previewContainer">
    <img id="previewImage">
  </div>
</section>

<section id="aiSection">
  <h2>AI Feedback</h2>
  <ul id="feedbackList"></ul>

  <h2>Caption</h2>
  <p id="mainCaption"></p>
  <div id="hashtags"></div>

  <h2>Art Ideas</h2>
  <ul id="ideaList"></ul>

  <h2>Trends</h2>
  <div id="trendList"></div>
  <hr style="margin:40px 0;">

<section id="communityFeedback">
  <h2>Community Feedback</h2>

  <div class="community-actions">
    <button id="likeBtn">👍 Like</button>
    <span id="likeCount">0 likes</span>
  </div>

  <div class="comment-box">
    <textarea id="commentInput" placeholder="Leave a comment..."></textarea>
    <button id="commentBtn">Post Comment</button>
  </div>

  <ul id="commentList"></ul>
</section>

</main>
</body>
</html>
